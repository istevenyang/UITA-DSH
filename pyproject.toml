[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uita-dsh"
version = "0.1.0"
description = "UITA-DSH (Universal Intelligent Test Architecture With Deterministic Skill Harness & Cross-Platform UI Automation Runtime)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ist3venyang" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "atomacos>=3.2.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
]
# 灰度：WinUIAEngine 的 pywinauto 窗口内控件搜索后端（UIA_WIN_BACKEND=pywinauto 或 app extra["win_backend"]="pywinauto" 时启用）
win-pywinauto = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.scripts]
uita = "uita.__main__:_entrypoint"
dsh = "uita.tools.dsh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uita"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
